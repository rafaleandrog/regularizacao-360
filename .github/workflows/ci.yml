# CI de pull request da app `reg360`.
#
# Existe porque o repo só tinha o workflow de release (disparado por tag), então
# um PR podia quebrar `pnpm build` e o repo só descobrir no dia do release.
# Aqui não se cria tag, não se publica release e não se escreve no repositório.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          # @urbiverso/sdk é privado (GitHub Packages, org urbiverso). O GITHUB_TOKEN
          # efêmero deste repo NÃO tem read:packages cross-org (401), então usamos o
          # PAT guardado no secret URBIVERSO_PACKAGES_TOKEN.
          #
          # As DUAS variáveis são necessárias, e por motivos diferentes. O .npmrc do
          # PROJETO expande ${URBIVERSO_PACKAGES_TOKEN}; quando a var não existe, o pnpm
          # não deixa o token vazio — ele DESCARTA O ARQUIVO INTEIRO, com um WARN
          # ("Failed to replace env in config"). Junto com o token cai a linha
          # `@urbiverso:registry`, e aí `@urbiverso/sdk` é procurado no npmjs.org, que
          # responde 404 — sintoma que não parece de credencial, e NODE_AUTH_TOKEN
          # preenchido não salva. Medido nesta sessão com `pnpm config get`.
          NODE_AUTH_TOKEN: ${{ secrets.URBIVERSO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          URBIVERSO_PACKAGES_TOKEN: ${{ secrets.URBIVERSO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
